name: MarisShop
version: '1.0'
main: com.maris7.shop.MarisShop
api-version: '1.21'
folia-supported: true
depend: [ Vault ]
softdepend: [ PlaceholderAPI ]
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.xerial:sqlite-jdbc:3.53.0.0
  - com.mysql:mysql-connector-j:9.7.0

commands:
  shop:
    description: Open the shop
  shopreload:
    description: Reload MarisShop config and shop data
    permission: marisshop.admin
  marisshop:
    description: MarisShop admin commands
    usage: /marisshop reload

permissions:
  marisshop.admin:
    description: Admin commands
    default: op
