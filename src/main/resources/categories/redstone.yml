# ══════════════════════════════════════════════════
#  CATEGORY FILE — weapons.yml
# ══════════════════════════════════════════════════
#
#  FIELDS MỖI ITEM:
#    position       — slot trong GUI (0-26 với 27 slots)
#    material       — vật phẩm hiển thị + tặng nếu commands rỗng
#    name           — tên hiển thị (để rỗng "" = tự lấy tên material)
#    price          — giá tiền (Vault). 0 = miễn phí
#    price_shards   — giá shards (PAPI). 0 = không dùng shards
#    shard_placeholder — biến PAPI trả về số shards của player
#                        (bắt buộc nếu price_shards > 0)
#    initial_amount — số lượng mặc định khi mở confirm GUI
#    commands       — [] = tặng item trực tiếp | có lệnh = chạy lệnh, không tặng item
#                     placeholders: {player}, {amount}, {price}
#
# ══════════════════════════════════════════════════

