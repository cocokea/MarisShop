# sounds.yml — chỉnh âm thanh riêng ở đây
# Tên sound dùng Paper/Bukkit Sound enum (VD: UI_BUTTON_CLICK, ENTITY_EXPERIENCE_ORB_PICKUP)
# Hoặc namespace key (VD: minecraft:ui.button.click)

click:
  enabled: true
  sound: "UI_BUTTON_CLICK"
  volume: 1.0
  pitch: 1.0

purchase_success:
  enabled: true
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  volume: 1.0
  pitch: 1.0

purchase_failure:
  enabled: true
  sound: "ENTITY_VILLAGER_NO"
  volume: 1.0
  pitch: 1.0
